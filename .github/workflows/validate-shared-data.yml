name: Validate Shared Data

# Sin filtros de paths: el validador tarda segundos y vigila todo el repo (copias de shared/
# en cualquier app y duplicados entre todos los ficheros versionados).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate-shared-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shared data
        run: python3 scripts/validate_shared_data.py
